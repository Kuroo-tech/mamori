plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace 'com.reed.fcmguard'
    compileSdk 35

    defaultConfig {
        applicationId "com.reed.fcmguard"
        minSdk 21
        // Load-bearing: the vendor Settings.System whitelist write requires the legacy
        // target SDK code path. Do not raise this without replacing the write mechanism.
        targetSdk 22
        // Kept in this exact Groovy form: .github/workflows/build-apk.yml parses
        // versionName with sed to derive the release tag.
        //
        // 2.0.0 is the first Mamori release (Compose UI + Vietnamese). It must be higher
        // than upstream 1.5.9 / versionCode 30 so the fork installs as an upgrade of an
        // existing FCMGuard install rather than being rejected as a downgrade.
        versionCode 40
        versionName "2.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('ci-signing/fcmguard-debug.keystore')
            storePassword ('and' + 'roid')
            keyAlias 'fcmguarddebug'
            keyPassword ('and' + 'roid')
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Shrinking is verified by building the release APK in CI/local checks. Runtime
            // verification is still required before distribution; see docs/TESTING.md.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        // targetSdk 22 is load-bearing (the vendor Settings.System write needs the legacy
        // code path) and Mamori is not distributed through Google Play. This check states a
        // Play policy, not a defect, so it is disabled deliberately and only this check.
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }

    testOptions {
        unitTests.includeAndroidResources = false
        animationsDisabled = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.navigation.compose
    implementation libs.kotlinx.coroutines.android
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.foundation
    implementation libs.androidx.compose.material3

    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test

    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.runner
    debugImplementation libs.androidx.compose.ui.test.manifest
}
